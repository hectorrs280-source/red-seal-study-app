<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071016">
  <meta name="description" content="Aplicación bilingüe de estudio para Red Seal Industrial Electrician.">
  <title>Red Seal Industrial Electrician Study App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/speech.js"></script>
  <script defer src="js/progress.js"></script>
  <script defer src="js/flashcards.js"></script>
  <script defer src="js/quiz.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Red Seal Study">
        <span class="brand-mark">⚡</span>
        <span><strong>RED SEAL STUDY</strong><small>Industrial Electrician · EN / ES</small></span>
      </div>
      <nav class="tab-nav" aria-label="Navegación principal">
        <button class="tab-button active" data-tab="home">Inicio</button>
        <button class="tab-button" data-tab="flashcards">Flashcards</button>
        <button class="tab-button" data-tab="quiz">Quiz</button>
        <button class="tab-button" data-tab="guides">Guías</button>
        <button class="tab-button" data-tab="progress">Progreso</button>
      </nav>
    </header>

    <main>
      <section class="tab-panel active" id="tab-home" aria-label="Inicio"><div id="home-root"></div></section>
      <section class="tab-panel" id="tab-flashcards" aria-label="Flashcards"><div id="flashcards-root"></div></section>
      <section class="tab-panel" id="tab-quiz" aria-label="Quiz"><div id="quiz-root"></div></section>
      <section class="tab-panel" id="tab-guides" aria-label="Guías"><div id="guides-root"></div></section>
      <section class="tab-panel" id="tab-progress" aria-label="Progreso"><div id="progress-root"></div></section>
    </main>

    <footer class="footer">
      <strong>Red Seal Industrial Electrician Study App</strong> · Aplicación educativa sin dependencias externas. Los requisitos normativos deben contrastarse con la edición vigente de la norma aplicable.
    </footer>
  </div>
</body>
</html>
